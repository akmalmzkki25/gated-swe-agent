[project]
name = "track3"
version = "0.1.0"
description = "A verifier-gated SWE agent vs. mini-swe-agent on the same model (SWE-bench Verified study)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mini-swe-agent==2.4.6",
    # litellm.completion(tools=...) imports its MCP handler, which needs this extra (packaging gap in 1.108.1)
    "litellm[mcp]==1.108.1",
    "swebench==5.0.2",
    "datasets",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "typer",
]

[project.scripts]
track3 = "track3.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/track3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
